name: burndo

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: burndo
      POSTGRES_PASSWORD: burndo
      POSTGRES_DB: burndo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burndo -d burndo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://burndo:burndo@postgres:5432/burndo
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
